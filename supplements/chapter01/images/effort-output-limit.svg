<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="300" viewBox="0 0 1160 300" role="img"><title>出力上限にはthinkingの分も含まれる</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#232F3E"/></marker></defs><rect width="1160" height="300" fill="white"/><text x="20" y="40" fill="#232F3E" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="23" text-anchor="start" font-weight="600"><tspan x="20" dy="0">出力上限（maxTokens）</tspan></text><rect x="20" y="60" width="1120" height="70" rx="8" fill="white" stroke="#545B64" stroke-width="1"/><rect x="20" y="60" width="640" height="70" rx="8" fill="#eeebf4" stroke="#6f5ba6" stroke-width="1.6"/><text x="340.0" y="103.4" fill="#232F3E" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="400"><tspan x="340.0" dy="0">thinking</tspan></text><rect x="660" y="60" width="480" height="70" rx="8" fill="#e5edef" stroke="#28677d" stroke-width="1.6"/><text x="900.0" y="103.4" fill="#232F3E" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="400"><tspan x="900.0" dy="0">利用者に表示する回答</tspan></text><text x="20" y="180" fill="#232F3E" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="23" text-anchor="start" font-weight="600"><tspan x="20" dy="0">上限を小さくしすぎると</tspan></text><rect x="20" y="200" width="600" height="70" rx="8" fill="white" stroke="#545B64" stroke-width="1"/><rect x="20" y="200" width="420" height="70" rx="8" fill="#eeebf4" stroke="#6f5ba6" stroke-width="1.6"/><text x="230.0" y="243.4" fill="#232F3E" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="400"><tspan x="230.0" dy="0">thinking</tspan></text><rect x="440" y="200" width="180" height="70" rx="8" fill="#e5edef" stroke="#28677d" stroke-width="1.6"/><text x="530.0" y="242.7" fill="#232F3E" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="22" text-anchor="middle" font-weight="400"><tspan x="530.0" dy="0">回答の途中</tspan></text><path d="M639 224L661 246M661 224L639 246" fill="none" stroke="#c2703d" stroke-width="3.4"/><text x="680" y="244" fill="#c2703d" font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="22" text-anchor="start" font-weight="600">回答を書き終える前に上限に達する</text></svg>